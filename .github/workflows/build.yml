name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # On a v* tag, make the exe version match the tag (e.g. v1.0.0 -> 1.0.0),
      # since the bundle version comes from tauri.conf.json, not the git tag.
      - name: Sync app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $conf = "src-tauri/tauri.conf.json"
          (Get-Content $conf -Raw) -replace '("version":\s*")[^"]*(")', "`${1}$version`${2}" |
            Set-Content $conf -NoNewline -Encoding utf8
          Write-Host "Set app version to $version"

      - name: Build installer (draft release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('SolidLocker {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: Upload installer artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: solidlocker-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
